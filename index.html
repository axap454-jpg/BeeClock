
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17130c">
<title>BeeClock 1.2.1</title>

<style>
:root {
  --bg: #17130c;
  --panel: #211b10;
  --panel2: #2b2315;
  --text: #fff4d5;
  --muted: #b9a77b;
  --gold: #e9b949;
  --gold2: #ffdc83;
  --border: #8b6929;
  --shadow: #00000055;
  --danger: #e76c58;
  --green: #83c98c;
  --input: #17130c;
  --transition: .25s ease;
}

body.light {
  --bg: #f7f0df;
  --panel: #fff9eb;
  --panel2: #f0e3c5;
  --text: #352812;
  --muted: #806b43;
  --gold: #a97512;
  --gold2: #d59b24;
  --border: #c49a48;
  --shadow: #6b4c171c;
  --danger: #c94c3b;
  --green: #438d50;
  --input: #fffdf6;
}

* {
  box-sizing: border-box;
  transition:
    background-color var(--transition),
    color var(--transition),
    border-color var(--transition),
    box-shadow var(--transition);
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  padding: 18px;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  max-width: 1100px;
  margin: auto;
  border: 2px solid var(--border);
  outline: 1px solid var(--gold);
  outline-offset: 5px;
  border-radius: 20px;
  padding: 18px;
  box-shadow: 0 12px 35px var(--shadow);
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 42px;
  height: 42px;
  color: var(--gold);
}

h1 {
  color: var(--gold);
  font-size: 27px;
  margin: 0;
  letter-spacing: 2px;
}

.version {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

.icon-button {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--gold);
  background: var(--panel);
}

.icon-button svg {
  width: 23px;
  height: 23px;
}

nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.nav-button {
  flex: 1;
  min-width: 105px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--muted);
  background: var(--panel);
}

.nav-button svg {
  width: 19px;
  height: 19px;
}

.nav-button.active {
  background: var(--gold);
  color: #241a08;
  border-color: var(--gold2);
  font-weight: bold;
}

.section {
  display: none;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  background: var(--panel);
  min-height: 350px;
}

.section.active {
  display: block;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--gold);
  margin: 0 0 20px;
  font-size: 21px;
}

.section-title svg {
  width: 25px;
  height: 25px;
}

.clock-display {
  text-align: center;
  padding: 28px 5px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--panel2);
  margin-bottom: 18px;
}

.clock-time {
  font-size: clamp(35px, 8vw, 70px);
  font-weight: bold;
  color: var(--gold2);
  font-variant-numeric: tabular-nums;
  letter-spacing: 2px;
}

.clock-date {
  color: var(--muted);
  margin-top: 10px;
  font-size: 15px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  align-items: center;
  margin: 12px 0;
}

select, input {
  color: var(--text);
  background: var(--input);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px;
  min-width: 0;
}

select {
  max-width: 100%;
}

.action {
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--gold);
  color: #241a08;
  padding: 10px 16px;
  font-weight: bold;
}

.action.secondary {
  background: var(--panel2);
  color: var(--text);
}

.action.danger {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
}

.action:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.small-label {
  color: var(--muted);
  font-size: 13px;
}

.world-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 10px;
  margin-top: 16px;
}

.world-item {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-variant-numeric: tabular-nums;
}

.world-item strong {
  color: var(--gold2);
}

.big-display {
  font-size: clamp(38px, 9vw, 65px);
  color: var(--gold2);
  font-weight: bold;
  text-align: center;
  font-variant-numeric: tabular-nums;
  padding: 30px 5px;
}

.center {
  text-align: center;
}

.laps {
  margin-top: 18px;
  display: grid;
  gap: 7px;
}

.lap {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px;
  display: flex;
  justify-content: space-between;
}

.timer-inputs {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 20px 0;
}

.timer-inputs input {
  width: 85px;
  text-align: center;
  font-size: 20px;
}

.timer-inputs span {
  color: var(--gold);
  font-size: 25px;
}

.option-row {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  margin: 12px 0;
}

.calendar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 15px;
}

.calendar-month {
  color: var(--gold2);
  font-size: 20px;
  font-weight: bold;
  text-align: center;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.calendar-day {
  min-height: 43px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel2);
}

.calendar-day.weekday {
  min-height: 30px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
}

.calendar-day.today {
  background: var(--gold);
  color: #241a08;
  font-weight: bold;
  border-color: var(--gold2);
}

.calendar-day.empty {
  border-color: transparent;
  background: transparent;
}

.alarm-form {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 18px;
}

.alarm-form input[type="time"] {
  min-width: 120px;
}

.alarm-list {
  display: grid;
  gap: 9px;
}

.alarm-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  border: 1px solid var(--border);
  background: var(--panel2);
  border-radius: 11px;
  padding: 12px;
}

.alarm-time {
  font-size: 21px;
  color: var(--gold2);
  font-weight: bold;
}

.alarm-name {
  color: var(--muted);
  font-size: 13px;
}

.empty-message {
  color: var(--muted);
  text-align: center;
  padding: 20px;
}

@media (max-width: 520px) {
  body { padding: 10px; }
  .app { padding: 12px; }
  .section { padding: 14px; }
  .nav-button { min-width: 85px; font-size: 13px; }
  .nav-button svg { width: 16px; height: 16px; }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3">
      <circle cx="32" cy="34" r="17"/>
      <path d="M20 22L13 13M44 22L51 13M25 17C15 4 4 12 15 25M39 17C49 4 60 12 49 25"/>
      <path d="M23 23L41 45M41 23L23 45"/>
      <path d="M27 15L25 9M37 15L39 9"/>
    </svg>
    <div>
      <h1>BeeClock</h1>
      <div class="version">Version 1.2.1</div>
    </div>
  </div>

  <button class="icon-button" id="themeButton" aria-label="Switch theme"></button>
</header>

<nav>
  <button class="nav-button active" data-section="clock">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    Clock
  </button>
  <button class="nav-button" data-section="stopwatch">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 13l4-3M9 2h6M12 5V2M19 6l2-2"/></svg>
    Stopwatch
  </button>
  <button class="nav-button" data-section="timer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 13V8M9 2h6M12 5V2"/></svg>
    Timer
  </button>
  <button class="nav-button" data-section="calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
    Calendar
  </button>
  <button class="nav-button" data-section="alarm">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4M4 3L2 5M20 3l2 2"/></svg>
    Alarm
  </button>
</nav>

<!-- CLOCK -->
<section class="section active" id="clock">
  <h2 class="section-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    Clock
  </h2>

  <div class="controls">
    <label class="small-label" for="clockMode">Clock mode</label>
    <select id="clockMode">
      <option value="local">Normal</option>
      <option value="extended">Extended (UTC -12 to +14)</option>
      <option value="super">Super Extended</option>
    </select>
  </div>

  <div class="clock-display">
    <div class="clock-time" id="mainClock">00:00:00.00</div>
    <div class="clock-date" id="mainDate">Loading...</div>
  </div>

  <div id="worldClockArea" style="display:none">
    <div class="small-label">World time zones</div>
    <div class="world-list" id="worldList"></div>
  </div>
</section>

<!-- STOPWATCH -->
<section class="section" id="stopwatch">
  <h2 class="section-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 13l4-3M9 2h6M12 5V2M19 6l2-2"/></svg>
    Stopwatch
  </h2>

  <div class="big-display" id="stopwatchDisplay">00:00:00.00</div>
  <div class="controls center" style="justify-content:center">
    <button class="action" id="swStart">Start</button>
    <button class="action secondary" id="swLap">Lap</button>
    <button class="action danger" id="swReset">Reset</button>
  </div>
  <div class="laps" id="lapList"></div>
</section>

<!-- TIMER -->
<section class="section" id="timer">
  <h2 class="section-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 13V8M9 2h6M12 5V2"/></svg>
    Timer
  </h2>

  <div class="timer-inputs">
    <input id="timerHours" type="number" min="0" max="999" value="0" aria-label="Hours">
    <span>:</span>
    <input id="timerMinutes" type="number" min="0" max="59" value="5" aria-label="Minutes">
    <span>:</span>
    <input id="timerSeconds" type="number" min="0" max="59" value="0" aria-label="Seconds">
  </div>

  <div class="big-display" id="timerDisplay">00:05:00</div>

  <div class="option-row">
    <input type="radio" name="timerSound" id="silentMode" value="silent">
    <label for="silentMode">Silent</label>
    <input type="radio" name="timerSound" id="melodyMode" value="melody" checked>
    <label for="melodyMode">Melody</label>
  </div>

  <div class="controls center" style="justify-content:center">
    <button class="action" id="timerStart">Start</button>
    <button class="action secondary" id="timerPause">Pause</button>
    <button class="action danger" id="timerReset">Reset</button>
  </div>
</section>

<!-- CALENDAR -->
<section class="section" id="calendar">
  <h2 class="section-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
    Calendar
  </h2>

  <div class="calendar-top">
    <button class="action secondary" id="prevMonth">Previous</button>
    <div class="calendar-month" id="calendarMonth"></div>
    <button class="action secondary" id="nextMonth">Next</button>
  </div>
  <div class="calendar-grid" id="calendarGrid"></div>
</section>

<!-- ALARM -->
<section class="section" id="alarm">
  <h2 class="section-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4M4 3L2 5M20 3l2 2"/></svg>
    Alarm
  </h2>

  <div class="alarm-form">
    <input type="time" id="alarmTime" required>
    <input type="text" id="alarmName" placeholder="Alarm name">
    <button class="action" id="addAlarm">Add alarm</button>
  </div>

  <div class="alarm-list" id="alarmList"></div>
</section>

</div>

<script>
/* NAVIGATION */
document.querySelectorAll(".nav-button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".nav-button").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));

    button.classList.add("active");
    document.getElementById(button.dataset.section).classList.add("active");
  });
});

/* THEME */
const moonSVG = `
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/>
</svg>`;

const sunSVG = `
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="12" cy="12" r="4"/>
<path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
</svg>`;

const themeButton = document.getElementById("themeButton");

function setTheme(light) {
  document.body.classList.toggle("light", light);
  themeButton.innerHTML = light ? moonSVG : sunSVG;
  localStorage.setItem("beeclock-theme", light ? "light" : "dark");
}

setTheme(localStorage.getItem("beeclock-theme") === "light");

themeButton.addEventListener("click", () => {
  setTheme(!document.body.classList.contains("light"));
});

/* CLOCK */
const mainClock = document.getElementById("mainClock");
const mainDate = document.getElementById("mainDate");
const clockMode = document.getElementById("clockMode");
const worldClockArea = document.getElementById("worldClockArea");
const worldList = document.getElementById("worldList");

const normalOffsets = Array.from({length: 27}, (_, i) => i - 12);

const superOffsets = [
  -720, -660, -600, -570, -540, -480, -420, -360,
  -300, -240, -210, -180, -120, -60, 0,
  60, 120, 180, 210, 240, 270, 300, 330, 345,
  360, 390, 420, 480, 510, 525, 540, 570, 600,
  630, 660, 690, 720, 765, 780, 840
];

function formatOffset(minutes) {
  const sign = minutes < 0 ? "-" : "+";
  const abs = Math.abs(minutes);
  const hours = Math.floor(abs / 60);
  const mins = abs % 60;
  return `UTC${sign}${hours}${mins ? ":" + String(mins).padStart(2, "0") : ""}`;
}

function timeAtOffset(date, offset) {
  const utc = date.getTime() + offset * 60000;
  const d = new Date(utc);
  const h = String(d.getUTCHours()).padStart(2, "0");
  const m = String(d.getUTCMinutes()).padStart(2, "0");
  const s = String(d.getUTCSeconds()).padStart(2, "0");
  const cs = String(Math.floor(d.getUTCMilliseconds() / 10)).padStart(2, "0");
  return `${h}:${m}:${s}.${cs}`;
}

function updateClock() {
  const now = new Date();
  const mode = clockMode.value;

  if (mode === "local") {
    const h = String(now.getHours()).padStart(2, "0");
    const m = String(now.getMinutes()).padStart(2, "0");
    const s = String(now.getSeconds()).padStart(2, "0");
    const cs = String(Math.floor(now.getMilliseconds() / 10)).padStart(2, "0");

    mainClock.textContent = `${h}:${m}:${s}.${cs}`;
    mainDate.textContent = now.toLocaleDateString("en-US", {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    });

    worldClockArea.style.display = "none";
  } else {
    const offset = -now.getTimezoneOffset();
    mainClock.textContent = timeAtOffset(now, offset);
    mainDate.textContent = `Your local time · ${formatOffset(offset)}`;

    worldClockArea.style.display = "block";
    renderWorldClocks(now, mode === "extended" ? normalOffsets : superOffsets);
  }
}

function renderWorldClocks(now, offsets) {
  worldList.innerHTML = offsets.map(offset => `
    <div class="world-item">
      <span>${formatOffset(offset)}</span>
      <strong>${timeAtOffset(now, offset)}</strong>
    </div>
  `).join("");
}

clockMode.addEventListener("change", updateClock);
setInterval(updateClock, 10);
updateClock();

/* STOPWATCH */
let swRunning = false;
let swStartTime = 0;
let swElapsed = 0;
let swInterval = null;
let laps = [];

const swDisplay = document.getElementById("stopwatchDisplay");
const swStartButton = document.getElementById("swStart");

function formatStopwatch(ms) {
  const total = Math.max(0, Math.floor(ms));
  const hours = Math.floor(total / 3600000);
  const minutes = Math.floor((total % 3600000) / 60000);
  const seconds = Math.floor((total % 60000) / 1000);
  const centiseconds = Math.floor((total % 1000) / 10);

  return [
    String(hours).padStart(2, "0"),
    String(minutes).padStart(2, "0"),
    String(seconds).padStart(2, "0")
  ].join(":") + "." + String(centiseconds).padStart(2, "0");
}

function updateStopwatch() {
  const current = swElapsed + (swRunning ? performance.now() - swStartTime : 0);
  swDisplay.textContent = formatStopwatch(current);
}

swStartButton.addEventListener("click", () => {
  if (swRunning) {
    swElapsed += performance.now() - swStartTime;
    swRunning = false;
    clearInterval(swInterval);
    swStartButton.textContent = "Continue";
  } else {
    swStartTime = performance.now();
    swRunning = true;
    swInterval = setInterval(updateStopwatch, 10);
    swStartButton.textContent = "Pause";
  }
  updateStopwatch();
});

document.getElementById("swReset").addEventListener("click", () => {
  swRunning = false;
  clearInterval(swInterval);
  swElapsed = 0;
  laps = [];
  swStartButton.textContent = "Start";
  document.getElementById("lapList").innerHTML = "";
  updateStopwatch();
});

document.getElementById("swLap").addEventListener("click", () => {
  if (!swRunning) return;

  const current = swElapsed + performance.now() - swStartTime;
  laps.unshift(current);

  document.getElementById("lapList").innerHTML = laps.map((lap, i) => `
    <div class="lap">
      <span>Lap ${laps.length - i}</span>
      <strong>${formatStopwatch(lap)}</strong>
    </div>
  `).join("");
});

/* TIMER */
let timerRemaining = 300000;
let timerEndTime = 0;
let timerRunning = false;
let timerInterval = null;
let audioContext = null;

const timerDisplay = document.getElementById("timerDisplay");
const timerStartButton = document.getElementById("timerStart");

function readTimerInputs() {
  const h = Math.max(0, Number(document.getElementById("timerHours").value) || 0);
  const m = Math.min(59, Math.max(0, Number(document.getElementById("timerMinutes").value) || 0));
  const s = Math.min(59, Math.max(0, Number(document.getElementById("timerSeconds").value) || 0));
  return (h * 3600 + m * 60 + s) * 1000;
}

function formatTimer(ms) {
  const totalSeconds = Math.ceil(Math.max(0, ms) / 1000);
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;

  return [h, m, s].map(n => String(n).padStart(2, "0")).join(":");
}

function updateTimerDisplay() {
  timerDisplay.textContent = formatTimer(timerRemaining);
}

function timerFinished() {
  timerRunning = false;
  clearInterval(timerInterval);
  timerRemaining = 0;
  updateTimerDisplay();
  timerStartButton.textContent = "Start";

  if (document.getElementById("melodyMode").checked) {
    playMelody();
  }
  alert("Timer finished!");
}

function tickTimer() {
  timerRemaining = Math.max(0, timerEndTime - Date.now());
  updateTimerDisplay();

  if (timerRemaining <= 0) timerFinished();
}

timerStartButton.addEventListener("click", () => {
  if (timerRunning) return;

  if (timerRemaining <= 0) timerRemaining = readTimerInputs();
  if (timerRemaining <= 0) return;

  timerEndTime = Date.now() + timerRemaining;
  timerRunning = true;
  timerStartButton.textContent = "Running";
  clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 100);
  tickTimer();
});

document.getElementById("timerPause").addEventListener("click", () => {
  if (!timerRunning) return;

  timerRemaining = Math.max(0, timerEndTime - Date.now());
  timerRunning = false;
  clearInterval(timerInterval);
  timerStartButton.textContent = "Continue";
  updateTimerDisplay();
});

document.getElementById("timerReset").addEventListener("click", () => {
  timerRunning = false;
  clearInterval(timerInterval);
  timerRemaining = readTimerInputs();
  timerStartButton.textContent = "Start";
  updateTimerDisplay();
});

["timerHours", "timerMinutes", "timerSeconds"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    if (!timerRunning) {
      timerRemaining = readTimerInputs();
      updateTimerDisplay();
    }
  });
});

function playMelody() {
  try {
    audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();

    const notes = [660, 880, 990, 880, 660, 880];
    notes.forEach((frequency, index) => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.001, audioContext.currentTime + index * 0.25);
      gain.gain.exponentialRampToValueAtTime(0.18, audioContext.currentTime + index * 0.25 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + index * 0.25 + 0.2);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(audioContext.currentTime + index * 0.25);
      oscillator.stop(audioContext.currentTime + index * 0.25 + 0.22);
    });
  } catch (error) {
    console.warn("Audio playback is unavailable.", error);
  }
}

updateTimerDisplay();

/* CALENDAR */
let calendarDate = new Date();
const calendarGrid = document.getElementById("calendarGrid");
const calendarMonth = document.getElementById("calendarMonth");

function renderCalendar() {
  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();

  calendarMonth.textContent = calendarDate.toLocaleDateString("en-US", {
    month: "long",
    year: "numeric"
  });

  const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  let html = weekdays.map(day => `<div class="calendar-day weekday">${day}</div>`).join("");

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();

  for (let i = 0; i < firstDay; i++) {
    html += `<div class="calendar-day empty"></div>`;
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const isToday =
      day === today.getDate() &&
      month === today.getMonth() &&
      year === today.getFullYear();

    html += `<div class="calendar-day ${isToday ? "today" : ""}">${day}</div>`;
  }

  calendarGrid.innerHTML = html;
}

document.getElementById("prevMonth").addEventListener("click", () => {
  calendarDate.setMonth(calendarDate.getMonth() - 1);
  renderCalendar();
});

document.getElementById("nextMonth").addEventListener("click", () => {
  calendarDate.setMonth(calendarDate.getMonth() + 1);
  renderCalendar();
});

renderCalendar();

/* ALARMS */
let alarms = [];

try {
  alarms = JSON.parse(localStorage.getItem("beeclock-alarms") || "[]");
  if (!Array.isArray(alarms)) alarms = [];
} catch {
  alarms = [];
}

function saveAlarms() {
  localStorage.setItem("beeclock-alarms", JSON.stringify(alarms));
}

function renderAlarms() {
  const list = document.getElementById("alarmList");

  if (!alarms.length) {
    list.innerHTML = `<div class="empty-message">No alarms yet.</div>`;
    return;
  }

  list.innerHTML = alarms.map(alarm => `
    <div class="alarm-item">
      <div>
        <div class="alarm-time">${alarm.time}</div>
        <div class="alarm-name">${escapeHTML(alarm.name || "Alarm")}</div>
      </div>
      <div class="controls">
        <button class="action secondary" data-toggle="${alarm.id}">
          ${alarm.enabled ? "Enabled" : "Disabled"}
        </button>
        <button class="action danger" data-delete="${alarm.id}">Delete</button>
      </div>
    </div>
  `).join("");

  list.querySelectorAll("[data-toggle]").forEach(button => {
    button.addEventListener("click", () => {
      const alarm = alarms.find(a => a.id === Number(button.dataset.toggle));
      if (!alarm) return;
      alarm.enabled = !alarm.enabled;
      saveAlarms();
      renderAlarms();
    });
  });

  list.querySelectorAll("[data-delete]").forEach(button => {
    button.addEventListener("click", () => {
      alarms = alarms.filter(a => a.id !== Number(button.dataset.delete));
      saveAlarms();
      renderAlarms();
    });
  });
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

document.getElementById("addAlarm").addEventListener("click", () => {
  const time = document.getElementById("alarmTime").value;
  const name = document.getElementById("alarmName").value.trim();

  if (!time) {
    alert("Please select an alarm time.");
    return;
  }

  alarms.push({
    id: Date.now() + Math.floor(Math.random() * 1000),
    time,
    name,
    enabled: true,
    lastTriggered: ""
  });

  saveAlarms();
  renderAlarms();
  document.getElementById("alarmName").value = "";
});

function checkAlarms() {
  const now = new Date();
  const currentTime =
    String(now.getHours()).padStart(2, "0") + ":" +
    String(now.getMinutes()).padStart(2, "0");

  const today = now.toDateString();

  alarms.forEach(alarm => {
    if (
      alarm.enabled &&
      alarm.time === currentTime &&
      alarm.lastTriggered !== today
    ) {
      alarm.lastTriggered = today;
      saveAlarms();

      playMelody();
      alert(`Alarm: ${alarm.name || alarm.time}`);
    }
  });
}

setInterval(checkAlarms, 1000);
renderAlarms();
</script>
